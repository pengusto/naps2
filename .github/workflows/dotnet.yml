name: .NET

# Keep the cross-platform checks; prepare the fork's source-built dependency
# and use the same SDK/Xcode generation as the standalone macOS release.
on:
  push:
    branches-ignore: ['es60w-macos-release']
    tags-ignore: ['es60w-*']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, xcode-27]
    steps:
    - name: Install OS dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: sudo apt-get install -y fonts-liberation2 fonts-noto-core fonts-noto-cjk
    - uses: actions/checkout@v4
    - name: Set Xcode version
      if: matrix.os == 'xcode-27'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.401
    - name: Build preferred SimpleBase source input
      shell: bash
      run: |
        dotnet pack es60w/dependencies/SimpleBase/SimpleBase.Es60w.csproj -c Release --disable-build-servers -maxcpucount:1 -p:BuildInParallel=false -p:UseSharedCompilation=false -o "$RUNNER_TEMP/es60w-feed"
        dotnet nuget add source "$RUNNER_TEMP/es60w-feed" --name es60w-source-built
    - name: Install workloads
      if: matrix.os == 'xcode-27'
      run: dotnet workload install macos --version 10.0.401.1
    - name: Build
      run: dotnet run --project NAPS2.Tools -- build debug -v
    - name: Test
      if: matrix.os != 'xcode-27'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui
    - name: Test (mac)
      if: matrix.os == 'xcode-27'
      run: |
        # Exercise the shipping static-registrar app, rather than the debug
        # launcher that hangs in CLI image operations on the macOS 27 runner.
        dotnet build NAPS2.App.Mac/NAPS2.App.Mac.csproj -c Release -r osx-arm64 --disable-build-servers -maxcpucount:1 -p:BuildInParallel=false -p:UseSharedCompilation=false -p:SupportedOSPlatformVersion=14.0 -p:EnableCodeSigning=false
        NAPS2_TEST_ROOT="$GITHUB_WORKSPACE/NAPS2.App.Mac/bin/Release/net10.0-macos/osx-arm64" dotnet run --project NAPS2.Tools -- test -v --nogui --nonetwork
    - name: Test ES60W page framing without scanner access
      if: matrix.os == 'ubuntu-24.04'
      run: |
        dotnet build NAPS2.Images/NAPS2.Images.csproj -c Release -f net10.0 --disable-build-servers -p:UseSharedCompilation=false
        dotnet run --project es60w/verification/page-frame-check -p:Naps2Source="$GITHUB_WORKSPACE"
    - name: Test (WPF images)
      if: matrix.os == 'windows-2025'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui --images wpf --scope sdk
    - name: Test (ImageSharp images)
      if: matrix.os == 'ubuntu-24.04'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui --images is --scope sdk
    - name: Build and check ES60W native helper
      if: matrix.os == 'xcode-27'
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool cmake pkgconf
        mkdir -p "$RUNNER_TEMP/es60w-downloads"
        python3 es60w/build-native.py --downloads "$RUNNER_TEMP/es60w-downloads" --output "$RUNNER_TEMP/es60w-native"
