name: ES60W complete app

on:
  pull_request:
    branches: [es60w-macos-release]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.401
    - name: Prepare pinned build tools
      run: |
        test "$(uname -m)" = arm64
        dotnet workload install macos --version 10.0.401.1
        HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool cmake pkgconf
    - name: Restore verified release 4 dependency inputs
      run: |
        mkdir -p "$RUNNER_TEMP/es60w-inputs"
        curl --fail --location --silent --show-error https://github.com/pengusto/naps2/releases/download/es60w-v8.5.1-4/NAPS2-ES60W-8.5.1-es60w.4-sources.tar.gz -o "$RUNNER_TEMP/es60w-inputs/sources.tar.gz"
        echo 'df6066a152b364bc363957513afa5df3f7ee4c6c0c612f24d737217eaae9ee0b  sources.tar.gz' > "$RUNNER_TEMP/es60w-inputs/SHA256SUMS"
        cd "$RUNNER_TEMP/es60w-inputs"
        shasum -a 256 -c SHA256SUMS
        tar -xzf sources.tar.gz --strip-components=1 NAPS2-ES60W-8.5.1-es60w.4-sources/dependencies NAPS2-ES60W-8.5.1-es60w.4-sources/package-inputs/nuget-feed
    - name: Build complete native helper and app
      run: |
        python3 es60w/build-native.py --downloads "$RUNNER_TEMP/es60w-inputs/dependencies" --output "$RUNNER_TEMP/es60w-native"
        python3 es60w/build-app.py --native-build "$RUNNER_TEMP/es60w-native" --output "$RUNNER_TEMP/es60w-app" --dotnet "$(command -v dotnet)" --nuget-source "$RUNNER_TEMP/es60w-inputs/package-inputs/nuget-feed" --sparkle-distribution "$RUNNER_TEMP/es60w-inputs/dependencies/Sparkle-2.10.1.tar.xz" --updates-config es60w/updates/channel.json
    - name: Check app startup and PDF export without scanner access
      run: |
        python3 es60w/tools/check-portable-start.py --app "$RUNNER_TEMP/es60w-app/NAPS2 ES60W.app" --output "$RUNNER_TEMP/es60w-startup-check"
        python3 es60w/tools/check-offline-export.py --app "$RUNNER_TEMP/es60w-app/NAPS2 ES60W.app" --output "$RUNNER_TEMP/es60w-pdf-check"
    - name: Archive app with symlinks and signatures preserved
      run: |
        mkdir -p "$RUNNER_TEMP/es60w-artifacts"
        ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/es60w-app/NAPS2 ES60W.app" "$RUNNER_TEMP/es60w-artifacts/NAPS2-ES60W-arm64.zip"
        cp "$RUNNER_TEMP/es60w-app/build-result.json" "$RUNNER_TEMP/es60w-artifacts/"
        cp "$RUNNER_TEMP/es60w-startup-check/result.json" "$RUNNER_TEMP/es60w-artifacts/startup-check.json"
        cp "$RUNNER_TEMP/es60w-pdf-check/result.json" "$RUNNER_TEMP/es60w-artifacts/pdf-check.json"
        cd "$RUNNER_TEMP/es60w-artifacts"
        shasum -a 256 NAPS2-ES60W-arm64.zip > SHA256SUMS
    - uses: actions/upload-artifact@v4
      with:
        name: es60w-complete-app-arm64
        path: ${{ runner.temp }}/es60w-artifacts/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve bounded build diagnostics on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: es60w-build-diagnostics
        path: |
          ${{ runner.temp }}/es60w-app/full-app-build.log
          ${{ runner.temp }}/es60w-app/source-built-dependency.log
          ${{ runner.temp }}/es60w-native/stages.json
          ${{ runner.temp }}/es60w-startup-check/*.log
          ${{ runner.temp }}/es60w-pdf-check/*.log
        if-no-files-found: warn
        retention-days: 7
